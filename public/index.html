<title>KY Nature Beauty</title>
<meta name="description" content="Inventario, ventas y agenda para salones de belleza">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#15130f;
  --bg-elev:#1e1b16;
  --bg-elev-2:#282319;
  --bg-elev-3:#332c1f;
  --line:rgba(214,190,148,0.16);
  --line-strong:rgba(214,190,148,0.34);
  --gold:#c8a35f;
  --gold-soft:#e5cf9d;
  --text:#f2ebdd;
  --text-dim:#bdaf95;
  --text-faint:#8d8065;
  --good:#93ab76;
  --good-bg:rgba(147,171,118,0.14);
  --good-line:rgba(147,171,118,0.4);
  --warn:#d6a94f;
  --warn-bg:rgba(214,169,79,0.15);
  --warn-line:rgba(214,169,79,0.45);
  --bad:#c2603f;
  --bad-bg:rgba(194,96,63,0.16);
  --bad-line:rgba(194,96,63,0.5);
  --shadow:0 18px 40px rgba(0,0,0,0.38);
  --shadow-s:0 6px 18px rgba(0,0,0,0.28);
  --r-s:9px; --r-m:14px; --r-l:24px;
  --font-d:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --font-b:'Jost','Segoe UI',Helvetica,Arial,sans-serif;
  color-scheme: dark;
}
*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  min-height:100%;
}
.bg-texture{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, rgba(200,163,95,0.10), transparent 60%),
    radial-gradient(ellipse 700px 500px at 110% 10%, rgba(200,163,95,0.06), transparent 55%);
}
h1,h2,h3,h4{font-family:var(--font-d); font-weight:600; letter-spacing:.01em; text-wrap:balance; margin:0;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; color:var(--text); background:var(--bg-elev-2); border:1px solid var(--line); border-radius:var(--r-s); padding:10px 12px; font-size:14.5px; width:100%; outline:none; transition:border-color .15s;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);}
label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; letter-spacing:.02em;}
.field{margin-bottom:14px;}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); font-weight:500;}
::selection{background:var(--gold); color:#20190f;}
a{color:var(--gold-soft);}
.tabular{font-variant-numeric:tabular-nums;}

#app{position:relative; z-index:1; display:flex; min-height:100%;}

/* ---- Sidebar (desktop) ---- */
.sidebar{
  width:236px; flex:none; background:var(--bg-elev); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:26px 18px; gap:26px; position:sticky; top:0; height:100vh;
}
.brand{display:flex; align-items:center; gap:11px; padding:0 4px;}
.brand svg{flex:none;}
.brand-name{font-family:var(--font-d); font-size:21px; line-height:1.1; color:var(--gold-soft); font-weight:600;}
.brand-tag{font-size:10.5px; color:var(--text-faint); letter-spacing:.08em; text-transform:uppercase; margin-top:2px;}
.nav{display:flex; flex-direction:column; gap:3px;}
.nav-item{display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:var(--r-s); color:var(--text-dim); text-decoration:none; font-size:14.5px; font-weight:500; border:1px solid transparent; background:none; text-align:left; width:100%;}
.nav-item svg{flex:none; opacity:.85;}
.nav-item:hover{background:var(--bg-elev-2); color:var(--text);}
.nav-item.active{background:var(--bg-elev-2); color:var(--gold-soft); border-color:var(--line-strong);}
.sidebar-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px;}

/* ---- Topbar ---- */
.topbar{display:none; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px)); background:var(--bg-elev); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5;}
.icon-btn{background:var(--bg-elev-2); border:1px solid var(--line); color:var(--text-dim); border-radius:999px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; position:relative; flex:none;}
.icon-btn:hover{color:var(--text);}
.badge-dot{position:absolute; top:-3px; right:-3px; background:var(--bad); color:#fff; font-size:10px; font-weight:700; min-width:17px; height:17px; border-radius:999px; display:flex; align-items:center; justify-content:center; padding:0 4px; border:2px solid var(--bg-elev);}

/* ---- Main / content ---- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.content{flex:1; padding:30px 34px 100px; max-width:1180px; width:100%; margin:0 auto;}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap;}
.page-head h1{font-size:30px;}
.page-head .sub{color:var(--text-dim); font-size:14px; margin-top:4px;}

/* ---- Buttons ---- */
.btn{display:inline-flex; align-items:center; gap:8px; justify-content:center; padding:11px 18px; border-radius:999px; font-size:14px; font-weight:600; border:1px solid var(--line-strong); background:var(--bg-elev-2); color:var(--text); white-space:nowrap;}
.btn:hover{border-color:var(--gold);}
.btn-primary{background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#231a0d; border-color:transparent;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-ghost{background:none; border-color:var(--line);}
.btn-danger{background:var(--bad-bg); border-color:var(--bad-line); color:var(--bad);}
.btn-sm{padding:7px 13px; font-size:12.5px;}
.btn-icon{width:36px; height:36px; padding:0; border-radius:999px;}

/* ---- Cards / grids ---- */
.card{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-l); padding:20px;}
.grid-kpi{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:22px;}
.kpi{background:var(--bg-elev); border:1px solid var(--line); border-radius:var(--r-m); padding:16px 18px;}
.kpi .eyebrow{margin-bottom:8px;}
.kpi .num{font-family:var(--font-d); font-size:30px; color:var(--gold-soft); font-weight:600;}
.kpi .unit{font-size:12.5px; color:var(--text-dim); margin-left:4px;}
.section{margin-bottom:26px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
.section-title h2{font-size:19px; color:var(--gold-soft);}

.two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
@media (max-width:760px){.two-col{grid-template-columns:1fr;}}

/* ---- Alert banner ---- */
.alert-row{display:flex; align-items:center; gap:12px; padding:13px 15px; border-radius:var(--r-m); border:1px solid var(--bad-line); background:var(--bad-bg); margin-bottom:9px;}
.alert-row.warn{border-color:var(--warn-line); background:var(--warn-bg);}
.alert-row .dot{width:9px; height:9px; border-radius:50%; background:var(--bad); flex:none;}
.alert-row.warn .dot{background:var(--warn);}
.alert-row .txt{flex:1; font-size:13.5px;}
.alert-row .txt b{color:var(--text);}
.alert-tag{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--bad); border:1px solid var(--bad-line); padding:2px 8px; border-radius:999px; flex:none;}
.alert-row.warn .alert-tag{color:var(--warn); border-color:var(--warn-line);}
.empty-note{color:var(--text-faint); font-size:13.5px; font-style:italic; padding:6px 2px;}

/* ---- Ranking list ---- */
.rank-list{display:flex; flex-direction:column; gap:8px;}
.rank-item{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line);}
.rank-item:last-child{border-bottom:none;}
.rank-n{font-family:var(--font-d); font-size:17px; color:var(--text-faint); width:22px; flex:none;}
.rank-body{flex:1; min-width:0;}
.rank-body .nm{font-size:14px; font-weight:500;}
.rank-body .mt{font-size:12px; color:var(--text-faint);}
.rank-bar-wrap{width:110px; height:6px; background:var(--bg-elev-2); border-radius:99px; overflow:hidden; flex:none;}
.rank-bar{height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-soft));}
.rank-qty{font-size:13.5px; color:var(--gold-soft); font-weight:600; width:56px; text-align:right; flex:none;}

/* ---- Table ---- */
.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m);}
table{width:100%; border-collapse:collapse; min-width:640px;}
th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:600; padding:12px 14px; background:var(--bg-elev-2); border-bottom:1px solid var(--line);}
td{padding:12px 14px; font-size:13.8px; border-bottom:1px solid var(--line); vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--bg-elev-2);}
.swatch{width:14px; height:14px; border-radius:50%; display:inline-block; border:1px solid var(--line-strong); vertical-align:-2px; margin-right:7px;}
.pill{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600; letter-spacing:.02em;}
.pill.ok{background:var(--good-bg); color:var(--good); border:1px solid var(--good-line);}
.pill.low{background:var(--warn-bg); color:var(--warn); border:1px solid var(--warn-line);}
.pill.out{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad-line);}
.row-actions{display:flex; gap:6px; justify-content:flex-end;}
.muted{color:var(--text-faint);}

/* ---- Tabs (segmented) ---- */
.seg{display:inline-flex; background:var(--bg-elev-2); border:1px solid var(--line); border-radius:999px; padding:3px;}
.seg button{background:none; border:none; color:var(--text-dim); font-size:13px; font-weight:600; padding:8px 16px; border-radius:999px;}
.seg button.active{background:var(--gold-soft); color:#23190c;}

/* ---- Modal ---- */
.modal-back{position:fixed; inset:0; background:rgba(10,8,5,0.6); backdrop-filter:blur(2px); z-index:40; display:flex; align-items:center; justify-content:center; padding:18px; padding-top:calc(18px + env(safe-area-inset-top,0px)); padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
.modal{background:var(--bg-elev); border:1px solid var(--line-strong); border-radius:var(--r-l); max-width:460px; width:100%; max-height:88vh; overflow-y:auto; padding:24px; box-shadow:var(--shadow);}
.modal h3{font-size:22px; color:var(--gold-soft); margin-bottom:4px;}
.modal .modal-sub{color:var(--text-dim); font-size:13px; margin-bottom:18px;}
.modal-foot{display:flex; justify-content:flex-end; gap:10px; margin-top:18px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:420px){.row2{grid-template-columns:1fr;}}

/* ---- Toast ---- */
.toast{position:fixed; left:50%; top:calc(18px + env(safe-area-inset-top,0px)); transform:translateX(-50%); background:var(--bg-elev-3); border:1px solid var(--gold); color:var(--gold-soft); padding:13px 22px; border-radius:999px; font-size:14px; font-weight:500; box-shadow:var(--shadow); z-index:60; display:flex; align-items:center; gap:10px; max-width:90vw;}
.toast strong{color:var(--text);}

/* ---- Onboarding ---- */
.onboard-wrap{min-height:100vh; width:100%; display:flex; align-items:center; justify-content:center; padding:30px 18px; position:relative; z-index:1;}
.onboard-card{max-width:460px; width:100%; background:var(--bg-elev); border:1px solid var(--line-strong); border-radius:var(--r-l); padding:36px 30px; box-shadow:var(--shadow);}
.onboard-logo{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; margin-bottom:24px;}
.onboard-logo h1{font-size:30px; color:var(--gold-soft);}
.onboard-logo p{color:var(--text-dim); font-size:13.5px;}

/* ---- Bottom tab bar (mobile) ---- */
.tabbar{display:none; position:fixed; left:0; right:0; bottom:0; background:var(--bg-elev); border-top:1px solid var(--line); padding:6px 4px; padding-bottom:calc(6px + env(safe-area-inset-bottom,0px)); z-index:20; justify-content:space-around;}
.tabbar button{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--text-faint); font-size:10px; font-weight:600; padding:6px 4px; flex:1;}
.tabbar button.active{color:var(--gold-soft);}

/* ---- Empty state ---- */
.empty-state{text-align:center; padding:46px 20px; color:var(--text-faint);}
.empty-state svg{margin-bottom:12px; opacity:.5;}
.empty-state p{font-size:14px;}

/* ---- Client list ---- */
.client-card{display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--line); border-radius:var(--r-m); margin-bottom:9px;}
.avatar{width:42px; height:42px; border-radius:50%; background:var(--bg-elev-3); color:var(--gold-soft); display:flex; align-items:center; justify-content:center; font-family:var(--font-d); font-size:17px; font-weight:600; flex:none; border:1px solid var(--line-strong);}
.client-info{flex:1; min-width:0;}
.client-info .nm{font-size:14.5px; font-weight:500;}
.client-info .mt{font-size:12.5px; color:var(--text-faint);}

.appt-day{margin-bottom:18px;}
.appt-day-label{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); margin-bottom:8px; padding-left:2px;}
.appt-card{display:flex; gap:12px; padding:13px 14px; border:1px solid var(--line); border-radius:var(--r-m); margin-bottom:8px; align-items:flex-start;}
.appt-time{font-family:var(--font-d); font-size:19px; color:var(--gold-soft); flex:none; width:56px;}
.appt-body{flex:1; min-width:0;}
.appt-body .nm{font-size:14.5px; font-weight:600;}
.appt-body .svc{font-size:13px; color:var(--text-dim); margin-top:2px;}
.appt-body .nt{font-size:12px; color:var(--text-faint); margin-top:3px;}

.tag-list{display:flex; flex-wrap:wrap; gap:7px;}
.tag-chip{display:flex; align-items:center; gap:6px; background:var(--bg-elev-2); border:1px solid var(--line); padding:5px 6px 5px 12px; border-radius:999px; font-size:12.5px;}
.tag-chip button{background:none; border:none; color:var(--text-faint); width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center;}
.tag-chip button:hover{color:var(--bad); background:var(--bad-bg);}

hr.sep{border:none; border-top:1px solid var(--line); margin:20px 0;}

/* ---- Chat assistant ---- */
.chat-fab{position:fixed; right:24px; bottom:28px; width:58px; height:58px; border-radius:50%; background:linear-gradient(180deg,var(--gold-soft),var(--gold)); border:none; color:#231a0d; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); z-index:30;}
.chat-fab:hover{filter:brightness(1.05);}
.chat-modal{display:flex; flex-direction:column; max-width:420px; width:100%; height:min(620px,78vh); padding:0; overflow:hidden;}
.chat-head{padding:16px 10px 14px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; flex:none;}
.chat-head h3{font-size:19px;}
.chat-messages{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px;}
.chat-bubble{max-width:85%; padding:10px 14px; border-radius:16px; font-size:13.8px; line-height:1.48;}
.chat-bubble.user{align-self:flex-end; background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#231a0d; border-bottom-right-radius:4px;}
.chat-bubble.assistant{align-self:flex-start; background:var(--bg-elev-2); border:1px solid var(--line); border-bottom-left-radius:4px;}
.chat-bubble.assistant.is-error{border-color:var(--bad-line); color:var(--bad);}
.chat-empty-hint{color:var(--text-faint); font-size:13px; text-align:center; padding:34px 14px;}
.chat-input-row{display:flex; gap:8px; padding:14px 16px; padding-bottom:calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); flex:none;}
.chat-input-row input{flex:1;}
.chat-typing{display:flex; gap:4px; padding:4px 2px;}
.chat-typing span{width:6px; height:6px; border-radius:50%; background:var(--text-faint); animation:chatTyping 1s infinite ease-in-out;}
.chat-typing span:nth-child(2){animation-delay:.15s;}
.chat-typing span:nth-child(3){animation-delay:.3s;}
@keyframes chatTyping{0%,80%,100%{opacity:.3; transform:translateY(0);} 40%{opacity:1; transform:translateY(-3px);}}
@media (prefers-reduced-motion:reduce){ .chat-typing span{animation:none;} }
@media (max-width:900px){
  .chat-fab{bottom:calc(84px + env(safe-area-inset-bottom,0px)); right:16px; width:52px; height:52px;}
}

@media (max-width:900px){
  .sidebar{display:none;}
  .topbar{display:flex;}
  .content{padding:20px 16px 90px;}
  .tabbar{display:flex;}
  .page-head h1{font-size:24px;}
}
</style>

<div id="app"></div>

function hexToRgb(h){ h=h.replace('#',''); return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]; }
function rgbToHex(r,g,b){ return '#'+[r,g,b].map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); var s=v.toString(16); return s.length<2?'0'+s:s; }).join(''); }
function mixHex(baseHex, tintHex, strength){
  if(!tintHex || !strength) return baseHex;
  var b=hexToRgb(baseHex), tt=hexToRgb(tintHex);
  var r=[0,1,2].map(function(i){ return b[i]*(1-strength)+tt[i]*strength; });
  return rgbToHex(r[0],r[1],r[2]);
}

function computeFormula(levelIdx, reflectKey){
  var level = levelIdx+1;
  var reflect = REFLECTS.filter(function(r){ return r.key===reflectKey; })[0] || REFLECTS[0];
  var baseHex = LEVEL_HEX[levelIdx];
  var resultHex = reflect.key==='natural' ? baseHex : mixHex(baseHex, reflect.tint, reflect.strength);
  var vol = 20, pct = Math.round(vol*0.3*10)/10;
  var time = level<=3 ? 40 : (level>=8 ? 30 : 35);
  var gA, gB;
  if(reflect.key==='natural'){ gA=60; gB=0; }
  else { var a=reflect.ratio[0], b=reflect.ratio[1]; gA=Math.round(60*a/(a+b)); gB=60-gA; }
  return {
    level:level, baseHex:baseHex, resultHex:resultHex, reflect:reflect,
    codeA: level+'.'+reflect.code, codeB: reflect.key==='natural' ? null : (level+'.'+reflect.secCode),
    gA:gA, gB:gB, vol:vol, pct:pct, time:time
  };
}

/* ================= date helpers ================= */
function pad2(n){ return n<10 ? '0'+n : ''+n; }
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function ymOf(iso){ return iso.slice(0,7); }
function dayOf(iso){ return iso.slice(8,10); }
function addDays(iso, n){ var d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(iso, withYear){
  try{
    var d = new Date(iso+'T00:00:00');
    return d.toLocaleDateString(LOCALE_MAP[getLang()]||'es-ES', withYear===false ? {day:'numeric',month:'short'} : {day:'numeric',month:'short',year:'numeric'});
  }catch(e){ return iso; }
}
function fmtMoney(n){
  var sym = (state.config && state.config.currencySymbol) || '$';
  var num = (Math.round((n||0)*100)/100).toLocaleString(LOCALE_MAP[getLang()]||'es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
  return sym + num;
}

/* ================= aggregation ================= */
function currentAndPrevYM(){
  var today = todayISO();
  var prev = addDays(ymOf(today)+'-01', -1);
  return [ymOf(today), ymOf(prev)];
}
// returns qty & revenue used for a product within [fromISO, toISO] inclusive, from usage docs
function usageInRange(fromISO, toISO){
  var totalsByProduct = {}; // id -> {qty, revenue}
  var grandQty=0, grandRevenue=0;
  state.usage.forEach(function(u){
    if(!u.days) return;
    Object.keys(u.days).forEach(function(dd){
      var iso = u.year+'-'+u.month+'-'+dd;
      if(iso < fromISO || iso > toISO) return;
      var qty = u.days[dd] || 0;
      if(!qty) return;
      var rev = qty * (u.price||0);
      grandQty += qty; grandRevenue += rev;
      var cur = totalsByProduct[u.productId] || {qty:0, revenue:0, brand:u.brand, color:u.color, name:u.name};
      cur.qty += qty; cur.revenue += rev;
      totalsByProduct[u.productId] = cur;
    });
  });
  return {byProduct: totalsByProduct, qty: grandQty, revenue: grandRevenue};
}
function usageLast30(){
  return usageInRange(addDays(todayISO(),-29), todayISO());
}

      if(activeValue!=null) el.value = activeValue;

      if(selStart!=null && el.setSelectionRange){

      }
    }

}

function renderDashboard(){
  var lang=getLang();
  var today = todayISO();
  var dateStr = new Date(today+'T00:00:00').toLocaleDateString(LOCALE_MAP[lang]||'es-ES', {weekday:'long', day:'numeric', month:'long'});
  var alerts = sortedProducts().filter(function(p){ return statusOf(p)!=='ok'; });

  var todayAgg = usageInRange(today, today);
  var weekAgg = usageInRange(addDays(today,-6), today);
  var monthAgg = usageInRange(ymOf(today)+'-01', today);
  var last30 = usageLast30();

  var ranked = Object.keys(last30.byProduct).map(function(id){ return Object.assign({id:id}, last30.byProduct[id]); }).sort(function(a,b){ return b.qty-a.qty; });
  var most = ranked.slice(0,5);
  var least = ranked.slice().sort(function(a,b){ return a.qty-b.qty; }).slice(0,5);
  var maxQty = most.length? most[0].qty : 1;

  var html = '';
  html += '<div class="page-head"><div><h1>'+esc(t('nav_dashboard'))+'</h1><div class="sub" style="text-transform:capitalize">'+t('dash_sub')+' '+esc(dateStr)+'</div></div></div>';

  html += '<div class="section">';
  html += '<div class="section-title"><h2>'+t('dash_alerts')+'</h2></div>';
  if(!alerts.length){
    html += '<div class="empty-note">'+t('dash_no_alerts')+'</div>';
  } else {
    alerts.forEach(function(p){
      var s = statusOf(p);
      html += '<div class="alert-row'+(s==='low'?' warn':'')+'">'+
        '<span class="dot"></span>'+
        '<span class="txt"><b>'+productLabel(p)+'</b> — '+ (s==='out' ? t('dash_out_of') : (t('dash_left')+' '+ (p.stock||0) +' '+esc(p.unit||t('unit_ml'))) ) +'</span>'+
        '<span class="alert-tag">'+ (s==='out' ? t('dash_urgent') : t('dash_low')) +'</span>'+
      '</div>';
    });
  }
  html += '</div>';

  html += '<div class="grid-kpi">';
  html += kpi(t('dash_used_today'), todayAgg.qty);
  html += kpi(t('dash_used_week'), weekAgg.qty);
  html += kpi(t('dash_used_month'), monthAgg.qty);
  html += kpi(t('dash_sales_week'), fmtMoney(weekAgg.revenue), true);
  html += kpi(t('dash_sales_month'), fmtMoney(monthAgg.revenue), true);
  html += '</div>';

  html += '<div class="two-col">';
  html += '<div class="card"><div class="section-title"><h2 style="font-size:16.5px">'+t('dash_most')+'</h2></div>'+renderRankList(most, maxQty)+'</div>';
  html += '<div class="card"><div class="section-title"><h2 style="font-size:16.5px">'+t('dash_least')+'</h2></div>'+renderRankList(least, maxQty)+'</div>';
  html += '</div>';

  return html;
}
function kpi(label, val, isStr){
  return '<div class="kpi"><div class="eyebrow">'+esc(label)+'</div><div class="num tabular">'+(isStr?esc(val):Math.round(val))+'</div></div>';
}
function renderRankList(list, maxQty){
  if(!list.length) return '<div class="empty-note">'+t('dash_no_usage')+'</div>';
  return '<div class="rank-list">'+list.map(function(item, i){
    var pct = maxQty? Math.max(6, Math.round((item.qty/maxQty)*100)) : 6;
    return '<div class="rank-item"><div class="rank-n">'+(i+1)+'</div><div class="rank-body"><div class="nm">'+(item.brand?esc(item.brand)+' — ':'')+esc(item.color||item.name||'')+'</div><div class="mt">'+esc(t('rep_col_revenue'))+': '+fmtMoney(item.revenue)+'</div></div><div class="rank-bar-wrap"><div class="rank-bar" style="width:'+pct+'%"></div></div><div class="rank-qty tabular">'+item.qty+'</div></div>';
  }).join('')+'</div>';
}

      });

  }

  html += '<div style="margin-bottom:16px"><button class="btn btn-primary" data-action="new-appt">'+ICONS.plus+t('ag_add_appt')+'</button></div>';
  if(!state.appointments.length){
    html += '<div class="card empty-state">'+ICONS.empty+'<p>'+t('ag_empty_appts')+'</p></div>';
    return html;
  }
  var today = todayISO();
  var upcoming = state.appointments.filter(function(a){ return a.date>=today; }).sort(function(a,b){ return (a.date+a.time).localeCompare(b.date+b.time); });
  var past = state.appointments.filter(function(a){ return a.date<today; }).sort(function(a,b){ return (b.date+b.time).localeCompare(a.date+a.time); });

  function group(list){
    var byDate = {};
    list.forEach(function(a){ (byDate[a.date]=byDate[a.date]||[]).push(a); });
    return Object.keys(byDate).sort().map(function(d){ return [d, byDate[d]]; });
  }
  function renderApptGroup(list, title){
    if(!list.length) return '';
    var out = '<div class="appt-day"><div class="appt-day-label">'+title+'</div>';
    group(list).forEach(function(pair){
      out += '<div style="font-size:12px;color:var(--text-dim);margin:10px 0 6px;text-transform:capitalize">'+esc(fmtDate(pair[0]))+'</div>';
      pair[1].forEach(function(a){
        out += '<div class="appt-card"><div class="appt-time">'+esc(a.time||'--:--')+'</div><div class="appt-body"><div class="nm">'+esc(a.clientName)+'</div><div class="svc">'+esc(a.service||'')+'</div>'+(a.notes?'<div class="nt">'+esc(a.notes)+'</div>':'')+'</div>'+
          '<div class="row-actions"><button class="btn btn-icon btn-ghost" data-action="edit-appt" data-id="'+a.id+'">'+ICONS.edit+'</button><button class="btn btn-icon btn-danger" data-action="delete-appt" data-id="'+a.id+'">'+ICONS.trash+'</button></div></div>';
      });
    });
    out += '</div>';
    return out;
  }
  html += renderApptGroup(upcoming, t('ag_upcoming'));
  html += renderApptGroup(past, t('ag_past'));
  return html;
}

function renderFormulas(){
  var lang = getLang();
  var li = state.formulaLevel!=null ? state.formulaLevel : 6;
  var rk = state.formulaTarget || 'ash';

  var f = computeFormula(li, rk);
  var codeNameMap = {};
  REFLECTS.forEach(function(r){ codeNameMap[r.code] = r.names[lang]; });

  var levelOpts = LEVEL_NAMES[lang].map(function(nm,i){ return '<option value="'+i+'"'+(li===i?' selected':'')+'>'+(i+1)+' — '+esc(nm)+'</option>'; }).join('');
  var targetOpts = REFLECTS.map(function(r){ return '<option value="'+r.key+'"'+(rk===r.key?' selected':'')+'>'+esc(r.names[lang])+'</option>'; }).join('');
  var skinOpts = ['warm','cool','neutral'].map(function(k){ return '<option value="'+k+'"'+(sk===k?' selected':'')+'>'+esc(t('form_skin_'+k))+'</option>'; }).join('');

  var nameA = codeNameMap[f.reflect.code];
  var formulaLine = f.reflect.key==='natural'
    ? t('form_single', {gA:f.gA, codeA:f.codeA, nameA:nameA})
    : t('form_mix', {gA:f.gA, codeA:f.codeA, nameA:nameA, gB:f.gB, codeB:f.codeB, nameB:codeNameMap[f.reflect.secCode]});

  var recommended = SKIN_TONE_RECOMMEND[sk] || [];

  var html = '';
  html += '<div class="page-head"><div><h1>'+t('nav_formulas')+'</h1><div class="sub">'+t('form_sub')+'</div></div></div>';

    var r = REFLECTS.filter(function(x){ return x.key===key; })[0];
    var active = key===rk;
    return '<button type="button" class="btn btn-sm" data-action="formula-pick" data-key="'+key+'"'+
      (active?' style="border-color:var(--gold);background:var(--gold-soft);color:#23190c"':'')+
      '>'+esc(r.names[lang])+'</button>';
  }).join('')+'</div>';
  html += '<p class="empty-note" style="margin-bottom:18px">'+t('form_skin_tip_'+sk)+'</p>';

  html += '<div style="display:flex; gap:20px; align-items:center; margin:0 0 24px;">';
  html += '<div style="text-align:center"><div style="width:72px;height:72px;border-radius:50%;background:'+f.baseHex+';border:2px solid var(--line-strong)"></div><div class="eyebrow" style="margin-top:8px">'+t('form_before')+'</div></div>';
  html += '<div style="color:var(--text-faint);font-size:22px">→</div>';
  html += '<div style="text-align:center"><div style="width:86px;height:86px;border-radius:50%;background:'+f.resultHex+';border:2px solid var(--gold);box-shadow:var(--shadow-s)"></div><div class="eyebrow" style="margin-top:8px;color:var(--gold-soft)">'+t('form_after')+'</div></div>';
  html += '</div>';

  html += '<hr class="sep">';
  html += '<h3 style="font-size:18px;color:var(--gold-soft);margin-bottom:10px">'+t('form_formula_title')+'</h3>';
  html += '<p style="font-size:15px;margin-bottom:6px">'+esc(formulaLine)+'</p>';

  return html;

function renderChatPanel(){

  var body = '<div class="chat-head"><h3>'+t('chat_title')+'</h3><button class="icon-btn" data-action="close-chat">'+ICONS.close+'</button></div>';
  body += '<div class="chat-messages">';
  if(!msgs.length){
    body += '<div class="chat-empty-hint">'+t('chat_empty')+'</div>';
  } else {
    msgs.forEach(function(m){
      if(m.role==='assistant' && m.streaming && !m.text){
        body += '<div class="chat-bubble assistant"><div class="chat-typing"><span></span><span></span><span></span></div></div>';
      } else {
        body += '<div class="chat-bubble '+m.role+(m.isError?' is-error':'')+'">'+esc(m.text).replace(/\n/g,'<br>')+'</div>';
      }
    });
  }
  body += '</div>';
  body += '<form id="chat-form" class="chat-input-row">'+
    '<input id="chat-input" placeholder="'+esc(t('chat_placeholder'))+'" autocomplete="off"'+(state.chatBusy?' disabled':'')+'>'+
    '<button class="btn btn-primary btn-icon" type="submit"'+(state.chatBusy?' disabled':'')+'>'+ICONS.send+'</button>'+
  '</form>';
  return '<div class="modal-back" data-action="chat-back"><div class="modal chat-modal" data-stop="1">'+body+'</div></div>';
}

/* ================= RAG assistant (sample capability) ================= */
function buildSalonContext(){
  var today = todayISO();
  var lang = getLang();
  var cfg = state.config;
  var lines = [];
  lines.push('Salón: '+cfg.name+' ('+(COUNTRY_NAMES[lang][cfg.country]||cfg.country)+')');
  lines.push('');
  lines.push('INVENTARIO ('+state.products.length+' productos):');
  if(!state.products.length){ lines.push('- (sin productos registrados)'); }
  sortedProducts().forEach(function(p){
    var s = statusOf(p);
    lines.push('- '+(p.brand||'Sin marca')+' '+(p.color||p.name||'')+': '+(p.stock||0)+' '+(p.unit||'ml')+
      ' en stock, precio de venta '+fmtMoney(p.price)+', estado: '+(s==='out'?'AGOTADO':s==='low'?'STOCK BAJO':'disponible'));
  });

  var todayAgg = usageInRange(today, today);
  var weekAgg = usageInRange(addDays(today,-6), today);
  var monthAgg = usageInRange(ymOf(today)+'-01', today);
  var last30 = usageLast30();
  var ranked = Object.keys(last30.byProduct).map(function(id){ return Object.assign({id:id}, last30.byProduct[id]); }).sort(function(a,b){ return b.qty-a.qty; });

  lines.push('');
  lines.push('USO Y VENTAS:');
  lines.push('- Usado hoy: '+todayAgg.qty+' unidades, ventas '+fmtMoney(todayAgg.revenue));
  lines.push('- Usado en los últimos 7 días: '+weekAgg.qty+' unidades, ventas '+fmtMoney(weekAgg.revenue));
  lines.push('- Usado en el mes calendario actual: '+monthAgg.qty+' unidades, ventas '+fmtMoney(monthAgg.revenue));
  if(ranked.length){
    lines.push('- Ranking de uso de los últimos 30 días (de más a menos usado):');
    ranked.forEach(function(r,i){ lines.push('   '+(i+1)+'. '+(r.brand?r.brand+' ':'')+(r.color||r.name||'')+': '+r.qty+' unidades, ventas '+fmtMoney(r.revenue)); });
  } else {
    lines.push('- Sin uso registrado en los últimos 30 días.');
  }

  lines.push('');
  lines.push('CLIENTAS: '+state.clients.length+' registradas en total.');
  var upcoming = state.appointments.filter(function(a){ return a.date>=today; })
    .sort(function(a,b){ return (a.date+(a.time||'')).localeCompare(b.date+(b.time||'')); }).slice(0,20);
  lines.push('CITAS PRÓXIMAS ('+upcoming.length+' mostradas):');
  if(upcoming.length){
    upcoming.forEach(function(a){ lines.push('- '+a.date+' '+(a.time||'')+': '+a.clientName+' — '+(a.service||'sin servicio especificado')); });
  } else {
    lines.push('- No hay citas programadas.');
  }
  return lines.join('\n');
}

function closeChat(){
  state.chatOpen = false;
  render();
}
async function sendChatMessage(question){
  question = (question||'').trim();
  if(!question || state.chatBusy) return;

  var history = state.chatMessages.filter(function(m){ return !m.isError; }).slice(-8);
  state.chatMessages.push({role:'user', text:question});
  state.chatMessages.push({role:'assistant', text:'', streaming:true});
  state.chatBusy = true;
  render();

  var apiMessages = history.map(function(m){ return {role:m.role, content:m.text}; });
  apiMessages.push({role:'user', content:question});

  var last = state.chatMessages[state.chatMessages.length-1];
  try{
    var resp = await fetch(apiUrl('/chat'), {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ system: buildChatInstructions(), messages: apiMessages })
    });
    if(!resp.ok){
      var errBody = await resp.json().catch(function(){ return {}; });
      if(errBody.error === 'chat_not_configured'){
        state.sampleAvailable = false; state.chatOpen = false;
      } else if(errBody.error === 'rate_limited'){
        last.text = t('chat_rate_limited'); last.isError = true;
      } else {
        last.text = t('chat_error_generic'); last.isError = true;
      }
    } else {
      var data = await resp.json();
      last.text = data.text || t('chat_error_generic');
    }
  }catch(e){
    last.text = t('chat_error_generic'); last.isError = true;
  }
  last.streaming = false;
  state.chatBusy = false;
  render();
}

/* ================= mutations ================= */
async function saveProduct(id, data){
  data.updatedAt = new Date().toISOString();
  if(id){ await Data.updateDoc('products', id, data); }
  else{ data.createdAt = data.updatedAt; await Data.addDoc('products', data); }
}
async function logUsage(productId, qty, dateISO, clientName){
  var p = state.products.find(function(x){ return x.id===productId; });
  if(!p) return;
  var newStock = Math.max(0, (p.stock||0) - qty);
  await Data.updateDoc('products', productId, {stock:newStock, updatedAt:new Date().toISOString()});

  var ym = ymOf(dateISO), day = dayOf(dateISO);
  var docId = productId+'__'+ym;
  var existing = state.usage.find(function(u){ return u.id===docId; });
  var days = Object.assign({}, existing && existing.days || {});
  days[day] = (days[day]||0) + qty;
  var totalQty = Object.keys(days).reduce(function(s,k){ return s+days[k]; }, 0);
  var totalRevenue = (existing && existing.totalRevenue || 0) + qty * (p.price||0);
  await Data.setDoc('usage', docId, {
    productId:productId, brand:p.brand||'', color:p.color||'', name:p.name||'', price:p.price||0,
    year:ym.slice(0,4), month:ym.slice(5,7), ym:ym, days:days, totalQty:totalQty, totalRevenue:totalRevenue,
    updatedAt:new Date().toISOString()
  });

  if(clientName){
    var lowStock = newStock <= ((p.threshold!=null?p.threshold:(state.config.defaultThreshold||5)));
    showToast((lowStock ? (t('dash_urgent')+': ') : '') + productLabel(p) + ' — ' + t('use_submit'));
  } else {
    showToast(productLabel(p) + ' — ' + t('use_submit'));
  }
}
async function saveClient(id, data){
  if(id){ await Data.updateDoc('clients', id, data); }
  else{ await Data.addDoc('clients', data); }
}
async function saveAppt(id, data){
  if(id){ await Data.updateDoc('appointments', id, data); }
  else{ await Data.addDoc('appointments', data); }
  var known = state.clients.find(function(c){ return c.name.toLowerCase()===data.clientName.toLowerCase(); });
  if(!known){ await Data.addDoc('clients', {name:data.clientName, phone:'', email:'', notes:''}); }
}

document.addEventListener('submit', function(e){
  if(e.target.id==='onboard-form'){
    e.preventDefault();

    var cfg = {
      name: document.getElementById('ob-name').value.trim() || 'KY Nature Beauty',
      country: country,
      currencySymbol: document.getElementById('ob-currency').value.trim() || '$',
      language: document.getElementById('ob-language').value,
      defaultThreshold: 5, brands: [], createdAt: new Date().toISOString()
    };
    if(!SALON_SLUG){
      SALON_SLUG = slugify(cfg.name) + '-' + Math.random().toString(36).slice(2,6);
      Data.setConfig(cfg).then(function(){
        location.href = '/s/' + SALON_SLUG;
      });
    } else {
      Data.setConfig(cfg).then(function(){
        state.lang = cfg.language;
        try{ localStorage.setItem('kynb_lang', cfg.language); }catch(err){}
      });
    }
  }
  if(e.target.id==='settings-form'){
    e.preventDefault();
    var patch = {
      name: document.getElementById('set-name').value.trim() || state.config.name,
      country: document.getElementById('set-country').value,
      currencySymbol: document.getElementById('set-currency').value.trim() || '$',
      language: document.getElementById('set-language').value,
      defaultThreshold: parseFloat(document.getElementById('set-threshold').value) || 0
    };
    Data.setConfig(Object.assign({}, state.config, patch)).then(function(){
      state.lang = patch.language;
      try{ localStorage.setItem('kynb_lang', patch.language); }catch(err){}
      showToast(t('set_saved'));
    });
  }
  if(e.target.id==='brand-form'){
    e.preventDefault();
    var inp = document.getElementById('new-brand');
    var val = inp.value.trim();
    if(val){
      var brands = (state.config.brands||[]).slice();
      if(brands.indexOf(val)===-1) brands.push(val);
      Data.setConfig(Object.assign({}, state.config, {brands:brands}));
    }
  }
  if(e.target.id==='product-form'){
    e.preventDefault();
    var data = {
      brand: document.getElementById('pf-brand').value.trim(),
      color: document.getElementById('pf-color').value.trim(),
      stock: parseFloat(document.getElementById('pf-stock').value)||0,
      unit: document.getElementById('pf-unit').value,
      threshold: parseFloat(document.getElementById('pf-threshold').value)||0,
      price: parseFloat(document.getElementById('pf-price').value)||0,
      hex: document.getElementById('pf-hex').value
    };
    saveProduct(state.modal.id, data).then(function(){ state.modal=null; render(); });
  }
  if(e.target.id==='use-form'){
    e.preventDefault();
    var qty = parseFloat(document.getElementById('uf-qty').value)||0;
    var date = document.getElementById('uf-date').value || todayISO();
    var client = document.getElementById('uf-client').value.trim();
    var pid = state.modal.id;
    logUsage(pid, qty, date, client).then(function(){ state.modal=null; render(); });
  }
  if(e.target.id==='client-form'){
    e.preventDefault();
    var data = {
      name: document.getElementById('cf-name').value.trim(),
      phone: document.getElementById('cf-phone').value.trim(),
      email: document.getElementById('cf-email').value.trim(),
      notes: document.getElementById('cf-notes').value.trim()
    };
    saveClient(state.modal.id, data).then(function(){ state.modal=null; render(); });
  }
  if(e.target.id==='appt-form'){
    e.preventDefault();
    var data = {
      clientName: document.getElementById('af-client').value.trim(),
      date: document.getElementById('af-date').value,
      time: document.getElementById('af-time').value,
      service: document.getElementById('af-service').value.trim(),
      notes: document.getElementById('af-notes').value.trim()
    };
    saveAppt(state.modal.id, data).then(function(){ state.modal=null; render(); });
  }
  if(e.target.id==='chat-form'){
    e.preventDefault();
    var inp = document.getElementById('chat-input');
    var q = inp.value;

document.addEventListener('click', function(e){
  var actEl = e.target.closest('[data-action]');
  if(e.target.closest('[data-stop]')) { if(!actEl){ return; } }
  if(!actEl){
    if(e.target.classList && e.target.classList.contains('modal-back')){ state.modal=null; render(); }
    return;
  }
  var action = actEl.getAttribute('data-action');
  if(action==='tab'){ state.tab = actEl.getAttribute('data-tab'); render(); }
  else if(action==='ag-tab'){ state.agTab = actEl.getAttribute('data-agtab'); render(); }
  else if(action==='rep-range'){ state.repRange = actEl.getAttribute('data-range'); render(); }
  else if(action==='new-product'){ state.modal = {type:'product'}; render(); }
  else if(action==='edit-product'){ var pid=actEl.getAttribute('data-id'); state.modal = {type:'product', id:pid, data: state.products.find(function(x){return x.id===pid;})}; render(); }
  else if(action==='delete-product'){ if(confirm(t('common_delete_q'))){ Data.deleteDoc('products', actEl.getAttribute('data-id')); } }
  else if(action==='log-use'){ state.modal = {type:'use', id:actEl.getAttribute('data-id')}; render(); }
  else if(action==='new-client'){ state.modal = {type:'client'}; render(); }
  else if(action==='edit-client'){ var cid=actEl.getAttribute('data-id'); state.modal = {type:'client', id:cid, data: state.clients.find(function(x){return x.id===cid;})}; render(); }
  else if(action==='delete-client'){ if(confirm(t('common_delete_q'))){ Data.deleteDoc('clients', actEl.getAttribute('data-id')); } }
  else if(action==='new-appt'){ state.modal = {type:'appt'}; render(); }
  else if(action==='edit-appt'){ var aid=actEl.getAttribute('data-id'); state.modal = {type:'appt', id:aid, data: state.appointments.find(function(x){return x.id===aid;})}; render(); }
  else if(action==='delete-appt'){ if(confirm(t('common_delete_q'))){ Data.deleteDoc('appointments', actEl.getAttribute('data-id')); } }
  else if(action==='close-modal' || action==='modal-back'){ if(action==='modal-back' && actEl!==e.target) return; state.modal=null; render(); }
  else if(action==='remove-brand'){ var idx=parseInt(actEl.getAttribute('data-idx'),10); var brands=(state.config.brands||[]).slice(); brands.splice(idx,1); Data.setConfig(Object.assign({}, state.config, {brands:brands})); }
  else if(action==='formula-pick'){ state.formulaTarget = actEl.getAttribute('data-key'); render(); }
  else if(action==='open-chat'){
    state.chatOpen = true; render();
    setTimeout(function(){ var el=document.getElementById('chat-input'); if(el) el.focus(); }, 0);
  }
  else if(action==='close-chat'){ closeChat(); }
  else if(action==='chat-back'){ if(actEl!==e.target) return; closeChat(); }
});

/* ================= boot ================= */
var unsubs = [];
async function boot(){
  if(!SALON_SLUG){
    state.ready = true;
    render();
    return;
  }
  await Data.init();
  state.sampleAvailable = true;
  unsubs.push(Data.subscribeConfig(function(cfg){
    var firstLoad = !state.ready;
    state.config = cfg;
    state.ready = true;
    render();
    if(cfg && firstLoad){
      try{
        if(!sessionStorage.getItem('kynb_welcomed')){
          sessionStorage.setItem('kynb_welcomed','1');
          showToast(t('welcome')+' <strong>'+esc(cfg.name)+'</strong>');
        }
      }catch(e){}
    }
  }));
  unsubs.push(Data.subscribeCollection('products', function(list){ state.products = list; render(); }));
  unsubs.push(Data.subscribeCollection('usage', function(list){ state.usage = list; render(); }));
  unsubs.push(Data.subscribeCollection('clients', function(list){ state.clients = list; render(); }));
  unsubs.push(Data.subscribeCollection('appointments', function(list){ state.appointments = list; render(); }));
}
render();
boot();

})();
