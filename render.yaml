# La base de datos ya no se declara aqui. Vive en Neon y su direccion se
# escribe a mano en el panel de Render, en Environment. Mientras este
# archivo declaraba una base propia y ataba DATABASE_URL a ella, bastaba
# con que Render releyera el archivo para apuntar la aplicacion a una base
# vacia y dejarla sin datos.

services:
  - type: web
    name: inventario
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    envVars:
      # sync: false quiere decir que este valor NO se toca desde aqui: lo
      # pone una persona en el panel y Render lo respeta. Es la direccion
      # de la base en Neon y lleva la contraseña dentro, asi que nunca se
      # escribe en este archivo, que si va a GitHub.
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Código que debe escribir quien quiera abrir un salón nuevo.
      # Déjalo en blanco y cualquiera con la dirección podrá abrir el suyo.
      - key: SIGNUP_CODE
        sync: false
      # Firma las sesiones. Sin él, todos quedan desconectados en cada deploy.
      - key: SESSION_SECRET
        generateValue: true
      # Correo por Gmail. Sin estas dos, la app funciona igual pero sin enviar
      # correos. La contraseña es una "contraseña de aplicación" de Google,
      # no la contraseña normal de la cuenta.
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      # Protege el trabajo diario de recordatorios.
      - key: CRON_SECRET
        generateValue: true
      # Tu consola en /admin: invitaciones de un solo uso y suspension.
      # Sin esta variable la consola no existe.
      - key: ADMIN_PASSWORD
        sync: false
