name: Recordatorios de citas

# Una vez al día le pide al servidor que envíe los recordatorios de las
# citas del día siguiente. El servidor decide a quién avisar y no manda
# nada dos veces, así que ejecutar esto de más es inofensivo.
on:
  schedule:
    # 15:00 UTC = 9:00 de la mañana en Illinois en invierno,
    # 10:00 en verano. GitHub solo entiende UTC, no cambia con el horario
    # de verano. Si prefieres otra hora, cambia el número de la izquierda.
    - cron: '0 15 * * *'
  # Permite lanzarlo a mano desde la pestaña Actions, para probar.
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # La dirección va aquí, a la vista, porque es la web pública: no hay
      # nada que ocultar y guardarla como secreto solo conseguía que los
      # registros la taparan justo cuando hacía falta leerla para saber por
      # qué fallaba. El secreto APP_URL, si existe, sigue teniendo
      # prioridad, por si algún día cambia el dominio.
      APP_URL_POR_DEFECTO: https://kynaturebeauty.com
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Despertar el servicio
        # En el plan gratuito de Render el servicio se duerme a los 15
        # minutos y la primera petición tarda cerca de un minuto. Esto lo
        # despierta primero para que la llamada de verdad no expire.
        #
        # Nunca hace fallar el trabajo: si no consigue despertarlo, el paso
        # siguiente lo intenta igual con sus propios reintentos y es ese el
        # que decide si hubo un problema real.
        continue-on-error: true
        run: |
          set -u
          # Al pegar un secreto en GitHub es fácil que se cuele un salto de
          # línea o un espacio al final. Sin limpiarlo, la dirección queda
          # malformada y curl falla al instante con el código 000.
          URL="$(printf '%s' "${APP_URL:-}" | tr -d '[:space:]' | sed 's#/*$##')"
          # Un secreto que no empiece por http no es una dirección, por muy
          # bien escrito que parezca en la caja donde se pegó. En ese caso
          # se usa la de aquí arriba en vez de fallar sin explicación.
          case "${URL}" in
            http://*|https://*) ;;
            *) URL="${APP_URL_POR_DEFECTO}" ;;
          esac
          echo "Despertando ${URL}"

          for intento in 1 2 3 4 5 6; do
            # -S muestra el motivo real cuando curl falla, en vez de dejar
            # solo un 000 que no dice nada.
            codigo=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "${URL}/healthz") || codigo="000"
            echo "intento ${intento}: HTTP ${codigo}"
            if [ "${codigo}" = "200" ]; then
              echo "Servicio despierto."
              exit 0
            fi
            sleep 15
          done
          echo "No respondió al despertarlo; se intenta el envío de todos modos."

      - name: Enviar los recordatorios
        run: |
          set -u
          URL="$(printf '%s' "${APP_URL:-}" | tr -d '[:space:]' | sed 's#/*$##')"
          # Un secreto que no empiece por http no es una dirección, por muy
          # bien escrito que parezca en la caja donde se pegó. En ese caso
          # se usa la de aquí arriba en vez de fallar sin explicación.
          case "${URL}" in
            http://*|https://*) ;;
            *) URL="${APP_URL_POR_DEFECTO}" ;;
          esac
          SECRET="$(printf '%s' "${CRON_SECRET:-}" | tr -d '[:space:]')"
          echo "Llamando a ${URL}"

          if [ -z "${SECRET}" ]; then
            echo "Falta el secreto CRON_SECRET en el repositorio."
            exit 1
          fi

          for intento in 1 2 3; do
            respuesta=$(curl -sS -w '\n%{http_code}' --max-time 120 \
              -X POST "${URL}/api/cron/reminders" \
              -H "x-cron-secret: ${SECRET}") || respuesta="(sin respuesta)
          000"
            codigo=$(printf '%s' "${respuesta}" | tail -n1)
            cuerpo=$(printf '%s' "${respuesta}" | sed '$d')

            echo "intento ${intento}: HTTP ${codigo}"
            echo "respuesta: ${cuerpo}"

            case "${codigo}" in
              200)
                echo "Recordatorios procesados."
                exit 0
                ;;
              401)
                echo "El secreto CRON_SECRET no coincide con el que tiene Render."
                exit 1
                ;;
              503)
                echo "Falta definir CRON_SECRET en Render."
                exit 1
                ;;
              000)
                echo "No se pudo conectar. Revisa que APP_URL sea la dirección correcta."
                ;;
            esac
            sleep 20
          done

          echo "No se pudo completar después de 3 intentos."
          exit 1
